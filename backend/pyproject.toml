[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF"]
# FastAPI evaluates dependency marker calls while defining routes by design.
ignore = ["B008"]
