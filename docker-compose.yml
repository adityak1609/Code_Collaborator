# Concord — Docker Compose (production-like)
# V1: Single backend worker for in-memory CRDT collaboration.

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: concord
      POSTGRES_PASSWORD: concord
      POSTGRES_DB: concord
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U concord"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    build: ./backend
    restart: "no"
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+psycopg://concord:concord@postgres:5432/concord
      SYNC_DATABASE_URL: postgresql+psycopg://concord:concord@postgres:5432/concord
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://concord:concord@postgres:5432/concord
      SYNC_DATABASE_URL: postgresql+psycopg://concord:concord@postgres:5432/concord
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      CRDT_FLUSH_INTERVAL_SECONDS: ${CRDT_FLUSH_INTERVAL_SECONDS:-30}
      CRDT_MAX_UPDATE_BYTES: ${CRDT_MAX_UPDATE_BYTES:-5242880}
      CRDT_CHECKPOINT_TTL_SECONDS: ${CRDT_CHECKPOINT_TTL_SECONDS:-604800}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
